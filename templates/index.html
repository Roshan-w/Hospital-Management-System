<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HMS | Smart Healthcare Platform</title>
    <!-- google fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-bg: #f8fafc;
            --admin-theme: #4338ca;
            --doctor-theme: #0ea5e9;
            --patient-theme: #10b981;
            --card-radius: 16px;
        }

        body { 
            font-family: 'Outfit', sans-serif; 
            background-color: var(--primary-bg);
            color: #1e293b;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.8) !important;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .card {
            border: none;
            border-radius: var(--card-radius);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        .btn-primary { 
            background-color: var(--admin-theme); 
            border: none; 
            border-radius: 10px;
            padding: 10px 24px;
            font-weight: 500;
        }

        .btn-outline-primary { border-color: var(--admin-theme); color: var(--admin-theme); border-radius: 10px; }
        .btn-outline-primary:hover { background-color: var(--admin-theme); }

        .table thead { background-color: #f1f5f9; }
        .table { border-radius: var(--card-radius); overflow: hidden; border: 1px solid #e2e8f0; }

        /* nicer looking scrollbars */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .modal-content { border: none; border-radius: 20px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); }
    </style>
</head>
<body>
    <div id="app"></div>
    <!-- vue and router -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/vue-router@4.0.15/dist/vue-router.global.js"></script>
    <!-- bootstrap js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- the main app code -->
    <script src="/static/js/app.js?v=2.3"></script>
</body>
</html>
